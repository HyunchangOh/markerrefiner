[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmprefilter"
version = "1.0.0"
description = "Filter MarkerMiner alignments by exon and intron structure before manual curation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mmprefilter contributors" }]

[project.scripts]
mmprefilter = "mmprefilter.cli:main"

[tool.setuptools.packages.find]
include = ["mmprefilter*"]
